<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; script-src 'self'; img-src 'self' data: blob:; connect-src 'self';" />
  <title>GTR Stickies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="note" id="note">
    <div class="grain" aria-hidden="true"></div>
    <header class="chrome">
      <div class="chrome-row" id="chrome-row">
        <div class="fold-hit" id="fold-hit" title="Double-click to fold or unfold">
          <span class="wordmark">GTR</span>
        </div>
        <div class="actions chrome-tools">
          <button type="button" class="icon-btn pin" id="pin" title="Keep on top" aria-label="Keep on top" aria-pressed="true">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path class="pin-body" d="M8.7 1.6c.9-.4 1.9-.2 2.6.5.7.7.9 1.7.5 2.6l-.3.7 1.8 1.8c.3.3.3.8 0 1.1l-.7.7c-.3.3-.8.3-1.1 0L10.3 7.8 5.9 12.2c-.2.2-.4.3-.7.3H3.8L2.4 13.9c-.2.2-.5.2-.7 0-.2-.2-.2-.5 0-.7l1.4-1.4v-1.4c0-.3.1-.5.3-.7L7.8 5.3 6.6 4.1c-.3-.3-.3-.8 0-1.1l.7-.7c.3-.3.8-.3 1.1 0L10.2 4l.7-.3z" />
            </svg>
          </button>
          <button type="button" class="icon-btn presenter" id="presenter" title="Presenter: hide pointer &amp; hide from screen share" aria-label="Presenter mode" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.8 8s2.4-4.2 6.2-4.2S14.2 8 14.2 8s-2.4 4.2-6.2 4.2S1.8 8 1.8 8z" />
              <circle cx="8" cy="8" r="1.7" />
              <path d="M3 13.2L13 3" />
            </svg>
          </button>
          <div class="swatches chrome-extra" id="swatches" role="group" aria-label="Paper color"></div>
          <button type="button" class="icon-btn chrome-extra" id="board" title="Dashboard" aria-label="Dashboard">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <rect x="2.6" y="4.2" width="10.8" height="9.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4" />
              <path d="M2.6 7.2h10.8M6 2.6v2.4M10 2.6v2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="icon-btn plus chrome-extra" id="plus" title="New note (Ctrl+N)" aria-label="New note">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path d="M8 2.5v11M2.5 8h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="icon-btn gear chrome-extra" id="settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path d="M6.4 1.8h3.2l.3 1.4c.4.15.77.37 1.1.64l1.38-.5 1.6 2.76-1.16.92a4.3 4.3 0 0 1 0 1.56l1.16.92-1.6 2.76-1.38-.5c-.33.27-.7.49-1.1.64l-.3 1.4H6.4l-.3-1.4a4.3 4.3 0 0 1-1.1-.64l-1.38.5L2.02 9.98l1.16-.92a4.3 4.3 0 0 1 0-1.56L2.02 6.58l1.6-2.76 1.38.5c.33-.27.7-.49 1.1-.64l.3-1.4z" fill="none" stroke="currentColor" stroke-width="1.3" />
              <circle cx="8" cy="8" r="1.7" fill="none" stroke="currentColor" stroke-width="1.3" />
            </svg>
          </button>
        </div>
        <div class="chrome-end">
          <button type="button" class="icon-btn list" id="manager" title="All notes" aria-label="All notes">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M3 4.2h10M3 8h10M3 11.8h7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="icon-btn min chrome-extra" id="minimize" title="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <path d="M3.5 8.2h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="icon-btn close" id="close" title="Close note" aria-label="Close note">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
      <div class="format-bar" id="format">
        <label class="sr-only" for="font">Font</label>
        <select id="font" class="fmt-wide" title="Font" aria-label="Font">
          <option value="Source Serif 4">Source Serif</option>
          <option value="Fraunces">Fraunces</option>
          <option value="DM Sans">DM Sans</option>
          <option value="Georgia">Georgia</option>
          <option value="Segoe UI">Segoe UI</option>
          <option value="JetBrains Mono">Mono</option>
          <option value="Caveat">Caveat</option>
        </select>
        <label class="sr-only" for="size">Size</label>
        <select id="size" class="fmt-wide" title="Font size (selected text)" aria-label="Font size">
          <option value="12">12</option>
          <option value="14">14</option>
          <option value="16" selected>16</option>
          <option value="18">18</option>
          <option value="22">22</option>
          <option value="28">28</option>
        </select>
        <div class="format-toggles fmt-core" role="group" aria-label="Emphasis">
          <button type="button" class="mark-btn" id="bold" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false"><span class="b">B</span></button>
          <button type="button" class="mark-btn" id="italic" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><span class="i">I</span></button>
          <button type="button" class="mark-btn" id="underline" title="Underline (Ctrl+Shift+U)" aria-label="Underline" aria-pressed="false"><span class="u">U</span></button>
          <button type="button" class="mark-btn" id="strike" title="Strike (Ctrl+Shift+X)" aria-label="Strike" aria-pressed="false"><span class="s">S</span></button>
        </div>
        <div class="ink-menu fmt-mid" id="ink-menu">
          <button type="button" class="ink-toggle" id="ink-toggle" title="Ink color" aria-label="Ink color" aria-haspopup="true" aria-expanded="false">
            <span class="ink-chip" id="ink-chip"></span>
            <span class="ink-label">Color</span>
          </button>
          <div class="ink-dropdown" id="ink-dropdown" hidden role="menu" aria-label="Ink color"></div>
        </div>
        <div class="format-toggles fmt-mid" role="group" aria-label="Highlight">
          <button type="button" class="mark-btn hl-btn" id="hl-yellow" title="Highlight yellow (Ctrl+H)" aria-label="Highlight yellow">
            <span class="hl-chip" style="--h:#F5E6A8"></span>
          </button>
          <button type="button" class="mark-btn hl-btn" id="hl-peach" title="Highlight peach (Ctrl+Shift+H)" aria-label="Highlight peach">
            <span class="hl-chip" style="--h:#F6C7A6"></span>
          </button>
          <button type="button" class="mark-btn hl-btn" id="hl-mint" title="Highlight mint" aria-label="Highlight mint">
            <span class="hl-chip" style="--h:#C9E4B8"></span>
          </button>
          <button type="button" class="mark-btn hl-btn" id="hl-clear" title="Remove highlight (Ctrl+U)" aria-label="Remove highlight">
            <span class="hl-chip hl-clear-chip"></span>
          </button>
        </div>
        <div class="format-toggles fmt-mid" role="group" aria-label="Lists">
          <button type="button" class="mark-btn" id="bullets" title="Bullets" aria-label="Bullets" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <circle cx="3.2" cy="4.2" r="1.1" fill="currentColor" />
              <circle cx="3.2" cy="8" r="1.1" fill="currentColor" />
              <circle cx="3.2" cy="11.8" r="1.1" fill="currentColor" />
              <path d="M6.2 4.2h7M6.2 8h7M6.2 11.8h7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="mark-btn" id="checks" title="Checklist" aria-label="Checklist" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <rect x="2.2" y="2.6" width="4.2" height="4.2" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.3" />
              <path d="M3.1 4.7l1.1 1.1 2-2.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
              <rect x="2.2" y="9.2" width="4.2" height="4.2" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.3" />
              <path d="M8.2 4.6h5.6M8.2 11.3h5.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="format-toggles fmt-wide" role="group" aria-label="Image">
          <button type="button" class="mark-btn" id="attach" title="Add image" aria-label="Add image">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <rect x="2.2" y="3.4" width="11.6" height="9.2" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.35" />
              <circle cx="5.4" cy="6.4" r="1.05" fill="currentColor" />
              <path d="M3.4 11.4l3.2-3.1 2.1 2 2.2-2.4 2.1 3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <label class="sr-only" for="leading">Line spacing</label>
        <select id="leading" class="fmt-wide" title="Line spacing" aria-label="Line spacing">
          <option value="1.2">1.2</option>
          <option value="1.45">1.45</option>
          <option value="1.55" selected>1.55</option>
          <option value="1.7">1.7</option>
          <option value="2">2.0</option>
        </select>
        <div class="format-toggles fmt-wide" role="group" aria-label="Alignment">
          <button type="button" class="mark-btn" id="align-left" title="Align left" aria-label="Align left" aria-pressed="true">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <path d="M3 4.2h10M3 8h7M3 11.8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="mark-btn" id="align-center" title="Align center" aria-label="Align center" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <path d="M3 4.2h10M4.5 8h7M3 11.8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <label class="opacity-wrap fmt-wide" title="Paper transparency">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path d="M8 2.2c2.6 3 4.4 5.1 4.4 7.2A4.4 4.4 0 0 1 8 13.8 4.4 4.4 0 0 1 3.6 9.4C3.6 7.3 5.4 5.2 8 2.2z" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path d="M8 12.6A3.2 3.2 0 0 0 11.2 9.4c0-.4-.1-.9-.4-1.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <input type="range" id="opacity" min="55" max="100" step="1" value="100" aria-label="Paper transparency" />
        </label>
      </div>
    </header>
    <div class="paper">
      <div id="text" class="is-empty" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true" data-placeholder="what’s on your mind"></div>
      <div class="stickers" id="stickers" aria-hidden="true"></div>
    </div>
    <div class="resize-handle" id="resize" title="Resize" aria-hidden="true">
      <span class="grip"></span>
    </div>
    <div class="confirm" id="confirm" hidden>
      <p class="confirm-copy">Discard this note?</p>
      <div class="confirm-row">
        <button type="button" class="ghost" id="keep">Keep</button>
        <button type="button" class="danger" id="discard">Discard</button>
      </div>
    </div>
    <div class="paper-menu" id="paper-menu" hidden role="menu" aria-label="Text"></div>
    <div class="paper-menu paper-flyout" id="paper-flyout" hidden role="menu"></div>
    <div class="find-strip" id="find-strip" hidden>
      <input type="search" id="find-input" placeholder="Find in note" aria-label="Find in note" autocomplete="off" spellcheck="false" />
      <span class="find-count" id="find-count"></span>
      <button type="button" class="find-nav" id="find-prev" title="Previous (Shift+F3)" aria-label="Previous match">↑</button>
      <button type="button" class="find-nav" id="find-next" title="Next (F3)" aria-label="Next match">↓</button>
      <button type="button" class="find-nav find-x" id="find-close" title="Close (Esc)" aria-label="Close find">×</button>
    </div>
    <div class="sticker-menu" id="sticker-menu" hidden role="menu" aria-label="Image">
      <button type="button" role="menuitem" data-act="snipe">Snipe text</button>
      <button type="button" role="menuitem" data-act="region">Snipe region</button>
      <button type="button" role="menuitem" data-act="copy">Copy image</button>
      <div class="menu-sep"></div>
      <button type="button" role="menuitem" data-act="forward">Bring forward</button>
      <button type="button" role="menuitem" data-act="back">Send back</button>
      <div class="menu-sep"></div>
      <button type="button" role="menuitem" data-act="remove">Remove</button>
    </div>
    <div class="snipe-slip" id="snipe-slip" hidden>
      <p class="snipe-kicker" id="snipe-kicker">Snipe</p>
      <div class="snipe-body" id="snipe-body"></div>
      <div class="snipe-actions">
        <button type="button" id="snipe-copy">Copy</button>
        <button type="button" id="snipe-drop">Drop into note</button>
        <button type="button" id="snipe-close">Close</button>
      </div>
    </div>
  </div>
  <script src="note.js"></script>
</body>
</html>
