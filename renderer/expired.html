<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>GTR Stickies</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #F6E6C8; }
    .expired {
      min-height: 100%;
      box-sizing: border-box;
      padding: 28px 28px 22px;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      color: #2A241C;
    }
    .expired h1 { font-size: 18px; margin: 0 0 12px; font-weight: 650; }
    .expired p { margin: 0 0 10px; line-height: 1.45; font-size: 14px; }
    .expired .contact { opacity: 0.7; font-size: 13px; }
    .expired button {
      margin-top: 14px;
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 8px 16px;
      background: #2A241C;
      color: #F8F1E3;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="expired">
    <h1>GTR Stickies</h1>
    <p>GTR Stickies has reached the end of this version. Please update to a new version.</p>
    <p class="contact">mail.asjau@gmail.com</p>
    <button type="button" id="quit">Quit</button>
  </div>
  <script src="expired.js"></script>
</body>
</html>
